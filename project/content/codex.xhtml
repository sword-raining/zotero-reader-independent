<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-reader-independent/content/ui.css" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul" xmlns:html="http://www.w3.org/1999/xhtml" class="zr-window" title="Zotero Reader · 文献精读" width="1040" height="820" onload="window.arguments[0].service.bindWindow(window)" onunload="window.arguments[0].service.unbindWindow(window)">
  <html:main class="zr-reading-shell">
    <html:header class="zr-reading-head"><html:div class="zr-row spread"><html:span class="zr-kicker">文献精读</html:span><html:span id="zrc-phase" class="zr-health" role="status">就绪</html:span></html:div><html:h1 id="zrc-title">文献精读</html:h1><html:div class="zr-reading-meta"><html:span>统一精读模板</html:span><html:span id="zrc-source"/></html:div><menulist id="zrc-template" hidden="hidden"><menupopup><menuitem value="general" label="论文精读"/></menupopup></menulist></html:header>
    <html:section id="zrc-next-step" class="zr-next-step" aria-live="polite"><html:div class="zr-next-copy"><html:h2 id="zrc-next-title">准备开始</html:h2><html:p id="zrc-next-description"/><html:p id="zrc-status" class="zr-status" role="status"/></html:div><html:div class="zr-next-actions"><html:button id="zrc-send" class="zr-primary">开始精读</html:button><html:button id="zrc-resume" class="zr-primary" hidden="hidden">继续检查</html:button><html:button id="zrc-import" class="zr-primary" hidden="hidden">保存笔记</html:button><html:button id="zrc-saved" class="zr-primary" hidden="hidden">查看笔记</html:button><html:button id="zrc-cancel" class="zr-quiet zr-danger" hidden="hidden">停止此篇</html:button><html:button id="zrc-save-edit" class="zr-primary" hidden="hidden">保存修改</html:button><html:button id="zrc-cancel-edit" hidden="hidden">取消编辑</html:button></html:div><html:p id="zrc-import-hint" hidden="hidden"/></html:section>
    <html:section class="zr-reading-body"><html:details id="zrc-attention" class="zr-attention" hidden="hidden"><html:summary>查看需要修订的内容</html:summary><html:p class="zr-caption">对照草稿和原文片段核对。你可以先让模型自动修订，也可以在此编辑后保存为人工修改稿。</html:p><html:pre id="zrc-attention-text"/><html:div id="zrc-issues"/></html:details><html:article id="zrc-answer" class="zr-reading-content"/><html:div id="zrc-editor-wrap" class="zr-editor-wrap" hidden="hidden"><html:label for="zrc-editor">编辑草稿</html:label><html:textarea id="zrc-editor" spellcheck="false"/><html:p class="zr-caption">保存后可作为人工修改稿导入，不会改动原 PDF。若文件在别处已被修改，会提示刷新，不会覆盖。</html:p></html:div></html:section>
    <html:footer class="zr-reading-foot"><html:button id="zrc-pdf" class="zr-quiet">打开正文 PDF</html:button><html:details id="zrc-more-actions" class="zr-more-actions zr-action-menu"><html:summary>更多操作</html:summary><html:div class="zr-menu-panel"><html:button id="zrc-edit" hidden="hidden">编辑草稿</html:button><html:button id="zrc-archive" hidden="hidden">归档／添加分类</html:button><html:button id="zrc-refresh">刷新结果</html:button><html:button id="zrc-folder">打开结果文件夹</html:button><html:button id="zrc-reread">重新精读</html:button><html:button id="zrc-reparse" title="仅在解析异常时使用：忽略缓存，重新上传当前正文 PDF 至 MinerU；不会自动重读或改写笔记。">重新解析正文 PDF</html:button></html:div></html:details></html:footer>
  </html:main>
</window>
